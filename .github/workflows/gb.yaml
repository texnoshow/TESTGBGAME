name: Build Game Boy ROM

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GBDK-2020
        run: |
          wget https://github.com
          tar -xzf gbdk-linux64.tar.gz
          echo "$GITHUB_WORKSPACE/gbdk/bin" >> $GITHUB_PATH

      - name: Compile ROM
        run: |
          lcc -o maze_game.gb main.c

      - name: Upload Game ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameBoy-ROM
          path: maze_game.gb
