name: Build Game Boy ROM

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile ROM using GBDK Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/src -w /src ghcr.io/gbdk-2020/gbdk-2020:latest lcc -o maze_game.gb main.c

      - name: Upload Game ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameBoy-ROM
          path: maze_game.gb
