name: Build Game Boy ROM

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up GBDK-2020
        uses: jleightcap/setup-gbdk@v1
        with:
          version: '4.3.0'

      - name: Compile ROM
        run: |
          lcc -o maze_game.gb main.c

      - name: Upload Game ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameBoy-ROM
          path: maze_game.gb
